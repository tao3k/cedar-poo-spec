name = "CedarPooSpec"
version = "0.1.0"
defaultTargets = ["CedarPooSpec"]

[[require]]
name = "Cedar"
git = { url = "https://github.com/cedar-policy/cedar-spec.git", subDir = "cedar-lean" }
rev = "017c35c3d1f856a0f8b62a66660ee6628870bbcf"

[[require]]
name = "LeanPoo"
git = "https://github.com/tao3k/lean-poo.git"
rev = "08be9d0ba9d4e842adba604bd9208e4c59fd96fd"

[[lean_lib]]
name = "CedarPooSpec"

[[lean_lib]]
name = "Examples"
roots = ["Examples"]
globs = ["Examples.+"]

[[lean_lib]]
name = "Productions"
roots = ["Productions"]
globs = ["Productions.+"]

[[lean_lib]]
name = "Tests"
roots = ["Tests"]
globs = ["Tests.+"]

[[lean_exe]]
name = "policyReuseNative"
root = "Benchmarks.PolicyReuse"

[[lean_exe]]
name = "functionalReuseNative"
root = "Benchmarks.FunctionalReuse"

[[lean_exe]]
name = "objectProfilesNative"
root = "Tests.Functional.ProfilesMain"

[[lean_exe]]
name = "caseManifestsNative"
root = "Examples.Manifests"

# Only the diagnostic executable imports this initialization observer.
[[lean_lib]]
name = "Benchmarks"
roots = ["Benchmarks.ManifestInitialization"]
globs = ["Benchmarks.ManifestInitialization"]

[[lean_exe]]
name = "manifestLifecycleNative"
root = "Benchmarks.ManifestLifecycle"

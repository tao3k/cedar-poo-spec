name = "CedarPooSpec"
version = "0.1.0"
defaultTargets = ["CedarPooSpec"]

[[require]]
name = "Cedar"
git = { url = "https://github.com/cedar-policy/cedar-spec.git", subDir = "cedar-lean" }
rev = "017c35c3d1f856a0f8b62a66660ee6628870bbcf"

[[require]]
name = "LeanPoo"
git = "https://github.com/tao3k/lean-poo.git"
rev = "ec661095bd873107e8ce2a9877254048cb9633ba"

[[lean_lib]]
name = "CedarPooSpec"

[[lean_lib]]
name = "Examples"
roots = ["Examples"]
globs = ["Examples.+"]

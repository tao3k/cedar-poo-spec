name: Lean CI

on:
  push:
    branches: [main, feat/cedar-evaluation-adapter]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: taiki-e/install-action@just
      - name: Install Org parser
        run: sudo apt-get update && sudo apt-get install -y emacs-nox cvc5
      - name: Build adapters and evaluate examples
        env:
          CVC5: /usr/bin/cvc5
        run: just check

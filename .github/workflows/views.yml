name: Cedar engineering views
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: views-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  render:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          auto-config: false
          use-github-cache: false
          build: false
          test: false
          lint: false
      - uses: taiki-e/install-action@b6a061addd82b81aaeca51bdf2c53cd707996e5a # just
      - uses: ./.github/actions/lean-cache
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: dev
      - run: bunx playwright install --with-deps chromium
        working-directory: dev
      - name: Build native producer and render current declarations
        run: just render
        working-directory: dev
      - name: Typecheck, SDK round-trip and invalidation controls
        run: just test
        working-directory: dev
      - name: Upload actual platform outputs and captured inputs
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: engineering-views-${{ matrix.os }}
          include-hidden-files: true
          if-no-files-found: error
          path: |
            dev/.generated/
            dev/d2/
            dev/sysml/

[package]
name = "cedar-poo-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Lean-POO policy artifacts and optional Cedar language conformance runner"

[features]
default = []
cedar-runtime = ["dep:base64", "dep:cedar-policy", "dep:sha2", "cedar-policy/ipaddr", "cedar-policy/decimal", "cedar-policy/datetime"]

[dependencies]
cedar-policy = { version = "=4.12.0", optional = true, default-features = false }
base64 = { version = "0.23", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", optional = true }

[[bin]]
name = "cedar-poo-bridge"
path = "src/main.rs"
required-features = ["cedar-runtime"]

[[example]]
name = "export_latency"
path = "examples/export_latency.rs"
required-features = ["cedar-runtime"]

[[example]]
name = "pseudonymization_local"
path = "examples/pseudonymization_local.rs"
required-features = ["cedar-runtime"]

[[example]]
name = "pseudonymization_google_contract"
path = "examples/pseudonymization_google_contract.rs"
required-features = ["cedar-runtime"]

[[test]]
name = "pseudonymization_crypto"
path = "tests/integration/pseudonymization_crypto.rs"
required-features = ["cedar-runtime"]

[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "9b95fd6744a89f3f38e87f9bda33ea762f1f65e1", default-features = false }
aes-siv = "0.7"
aes-gcm = "0.10"
hmac = "0.13"

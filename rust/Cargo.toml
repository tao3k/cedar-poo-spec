[package]
name = "cedar-poo-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Cedar policy language conformance runner for Lean-POO policy exports"

[dependencies]
cedar-policy = "=4.12.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "9b95fd6744a89f3f38e87f9bda33ea762f1f65e1", default-features = false }

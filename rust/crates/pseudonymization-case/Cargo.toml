[package]
name = "cedar-poo-pseudonymization-case"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Local and Google SDP pseudonymization cases"

[features]
default = []
local = ["dep:cedar-poo-runtime"]
google-contract = ["cedar-poo-pseudonymization/google-sdp"]
google-admission = ["google-contract", "dep:cedar-poo-google-sdp-host", "dep:cedar-poo-runtime"]

[dependencies]
cedar-poo-runtime = { workspace = true, optional = true }
cedar-poo-pseudonymization.workspace = true
cedar-poo-google-sdp-host = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
asp-rust.workspace = true
aes-siv.workspace = true
aes-gcm.workspace = true
hmac.workspace = true
sha2.workspace = true

[[example]]
name = "pseudonymization_local"
required-features = ["local"]
[[example]]
name = "pseudonymization_google_contract"
required-features = ["google-contract"]
[[example]]
name = "pseudonymization_google_admission"
required-features = ["google-admission"]
[[test]]
name = "pseudonymization_crypto"
path = "tests/integration/pseudonymization_crypto.rs"
required-features = ["local", "google-contract"]

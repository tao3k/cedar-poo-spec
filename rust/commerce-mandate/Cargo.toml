[package]
name = "cedar-poo-commerce-mandate"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded storage-independent AP2 Checkout mandate binding verification"

[features]
default = []
ap2-checkout = ["dep:base64", "dep:p256", "dep:serde", "dep:serde_json", "dep:sha2"]

[dependencies]
base64 = { workspace = true, optional = true }
p256 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
asp-rust.workspace = true

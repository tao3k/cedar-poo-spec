[package]
name = "cedar-poo-commerce-case"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Independent consumers of Lean commerce fixtures"

[features]
default = []
acceptance = ["cedar-poo-commerce/acceptance"]
projection = ["cedar-poo-commerce/projection"]
admission = ["projection", "cedar-poo-commerce/admission"]

[dependencies]
cedar-poo-commerce.workspace = true

[dev-dependencies]
asp-rust.workspace = true
serde_json.workspace = true
p256.workspace = true

[[test]]
name = "agentic_ai_commerce_signatures_consumer"
path = "tests/integration/agentic_ai_commerce_signatures_consumer.rs"

[[test]]
name = "agentic_ai_commerce_projection_consumer"
path = "tests/integration/agentic_ai_commerce_projection_consumer.rs"
required-features = ["projection"]

[[test]]
name = "agentic_ai_commerce_admission_consumer"
path = "tests/integration/agentic_ai_commerce_admission_consumer.rs"
required-features = ["admission"]

[[test]]
name = "agentic_ai_commerce_acceptance_consumer"
path = "tests/integration/agentic_ai_commerce_acceptance_consumer.rs"
required-features = ["acceptance"]

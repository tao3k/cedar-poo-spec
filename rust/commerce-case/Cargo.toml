[package]
name = "cedar-poo-commerce-case"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Independent consumers of Lean commerce fixtures"

[features]
default = []
projection = ["cedar-poo-commerce/projection"]
admission = ["projection", "cedar-poo-commerce/admission"]
budget-commit = ["admission", "dep:cedar-poo-commerce-mrr", "dep:mrr-data-content"]
credential = ["budget-commit", "cedar-poo-commerce-mrr/credential"]
consumption = ["credential", "cedar-poo-commerce-mrr/consumption"]

[dependencies]
cedar-poo-commerce.workspace = true
cedar-poo-commerce-mrr = { workspace = true, optional = true }
mrr-data-content = { workspace = true, optional = true }

[dev-dependencies]
asp-rust.workspace = true
serde_json.workspace = true
p256.workspace = true

[[test]]
name = "agentic_ai_commerce_signatures_consumer"
path = "tests/integration/agentic_ai_commerce_signatures_consumer.rs"

[[test]]
name = "agentic_ai_commerce_projection_consumer"
path = "tests/integration/agentic_ai_commerce_projection_consumer.rs"
required-features = ["projection"]

[[test]]
name = "agentic_ai_commerce_admission_consumer"
path = "tests/integration/agentic_ai_commerce_admission_consumer.rs"
required-features = ["admission"]

[[test]]
name = "agentic_ai_commerce_budget_projection_consumer"
path = "tests/integration/agentic_ai_commerce_budget_projection_consumer.rs"
required-features = ["budget-commit"]

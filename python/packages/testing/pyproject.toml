[project]
name = "cedar-poo-py-test"
version = "0.1.0"
description = "Conformance and proof-probe runner for Cedar POO"
requires-python = ">=3.11"
dependencies = ["cedar-poo-bridge==0.1.0"]

[project.optional-dependencies]
ap2-sdk = [
  "cryptography==46.0.5",
  "jwcrypto==1.5.6",
  "pydantic==2.12.5",
  "sd-jwt==0.10.4",
]

[project.scripts]
cedar-poo-py-test = "cedar_poo_py_test.cli:main"

[tool.uv.sources]
cedar-poo-bridge = { workspace = true }

[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

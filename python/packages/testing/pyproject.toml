[project]
name = "cedar-poo-testing"
version = "0.1.0"
description = "Conformance and proof-probe runner for Cedar POO"
requires-python = ">=3.11"
dependencies = ["cedar-poo-bridge==0.1.0"]

[project.scripts]
cedar-poo-test = "cedar_poo_testing.cli:main"

[tool.uv.sources]
cedar-poo-bridge = { workspace = true }

[build-system]
requires = ["uv_build==0.11.3"]
build-backend = "uv_build"

[workspace]
members = ["rust/*"]
exclude = ["rust/target"]
default-members = ["rust/bridge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
base64 = "0.23"
cedar-policy = { version = "=4.12.0", default-features = false }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa"] }
asp-rust = { git = "https://github.com/tao3k/asp-rust", rev = "9b95fd6744a89f3f38e87f9bda33ea762f1f65e1", default-features = false }
aes-siv = "0.7"
aes-gcm = "0.10"
hmac = "0.13"
cedar-poo-core = { path = "rust/core", default-features = false }
cedar-poo-runtime = { path = "rust/runtime", default-features = false }
cedar-poo-agentic = { path = "rust/agentic", default-features = false }
cedar-poo-commerce = { path = "rust/commerce", default-features = false }
cedar-poo-commerce-mandate = { path = "rust/commerce-mandate", default-features = false }
cedar-poo-pseudonymization = { path = "rust/pseudonymization", default-features = false }
cedar-poo-google-sdp-host = { path = "rust/google-sdp-host", default-features = false }
cedar-poo-disclosure-host = { path = "rust/disclosure-host", default-features = false }
